services:
  db:
    image: public.ecr.aws/docker/library/mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    platform: linux/amd64
    environment:
      MARIADB_DATABASE: plain_log_ci
      MARIADB_USER: plain_log_ci
      MARIADB_PASSWORD: ci-only-password
      MARIADB_ROOT_PASSWORD: ci-only-root-password
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: public.ecr.aws/docker/library/wordpress:7.0.3-php8.3-apache@sha256:a09147f15a882b956f67a617e9e1e053adf9322c45c797c2ff7c0e66522bf204
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: plain_log_ci
      WORDPRESS_DB_USER: plain_log_ci
      WORDPRESS_DB_PASSWORD: ci-only-password
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - wordpress_files:/var/www/html

  cli:
    image: public.ecr.aws/docker/library/wordpress:cli-2.12.0-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    platform: linux/amd64
    user: "33:33"
    working_dir: /var/www/html
    entrypoint: [wp]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: plain_log_ci
      WORDPRESS_DB_USER: plain_log_ci
      WORDPRESS_DB_PASSWORD: ci-only-password
    volumes:
      - wordpress_files:/var/www/html

volumes:
  wordpress_files:
