services:
  db:
    image: mariadb:10.11.19
    environment:
      MARIADB_DATABASE: plain_log_ci
      MARIADB_USER: plain_log_ci
      MARIADB_PASSWORD: ci-only-password
      MARIADB_ROOT_PASSWORD: ci-only-root-password
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:7.0.3-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: plain_log_ci
      WORDPRESS_DB_USER: plain_log_ci
      WORDPRESS_DB_PASSWORD: ci-only-password
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - wordpress_files:/var/www/html

  cli:
    image: wordpress:cli-2.12.0-php8.3
    user: "33:33"
    working_dir: /var/www/html
    entrypoint: [wp]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: plain_log_ci
      WORDPRESS_DB_USER: plain_log_ci
      WORDPRESS_DB_PASSWORD: ci-only-password
    volumes:
      - wordpress_files:/var/www/html

volumes:
  wordpress_files:
